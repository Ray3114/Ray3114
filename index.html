<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ray's Test Page</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: one centered column, a status card and a small interactive panel */
  :root {
    --bg: #f3f6f1;
    --surface: #ffffff;
    --fg: #1d2a22;
    --muted: #5c6b61;
    --line: #d6dfd6;
    --accent: #2f7a4b;
    --accent-fg: #ffffff;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111813; --surface: #18221b; --fg: #e3ece5; --muted: #98a89d;
      --line: #2a372e; --accent: #5cc283; --accent-fg: #0d1a12; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111813; --surface: #18221b; --fg: #e3ece5; --muted: #98a89d;
    --line: #2a372e; --accent: #5cc283; --accent-fg: #0d1a12; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-block: 56px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 28px;
  }
  .eyebrow {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent); margin: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
  }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 8vw, 52px);
    line-height: 1.05; margin: 8px 0 0; text-wrap: balance;
  }
  .lead { color: var(--muted); margin: 0; max-width: 46ch; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; display: grid; gap: 14px;
  }
  .row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .label { color: var(--muted); font-size: 14px; }
  .value { font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .panel { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  button {
    font: 600 16px var(--font-body); background: var(--accent); color: var(--accent-fg);
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #count {
    font-family: var(--font-display); font-weight: 600; font-size: 34px;
    font-variant-numeric: tabular-nums; min-width: 2ch;
  }
  footer { color: var(--muted); font-size: 14px; }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
</head>
<body>

<main class="wrap">
  <header>
    <p class="eyebrow"><span class="dot"></span>Page is live</p>
    <h1>Hello from Ray3114</h1>
  </header>
  <p class="lead">This is a test page. If you can read this in your browser, publishing works. The clock and the button below check that the page's scripts run too.</p>

  <section class="card" aria-label="Page status">
    <div class="row"><span class="label">Your local time</span><span class="value" id="clock">--:--:--</span></div>
    <hr>
    <div class="row"><span class="label">Screen width</span><span class="value" id="width">— px</span></div>
    <hr>
    <div class="row"><span class="label">Theme</span><span class="value" id="theme">—</span></div>
  </section>

  <section class="panel" aria-label="Click test">
    <button id="add" type="button">Click me</button>
    <button id="reset" type="button" class="ghost">Reset</button>
    <span id="count" aria-live="polite">0</span>
  </section>

  <footer>Interests: edge AI and AgTech.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString();
    $("width").textContent = window.innerWidth + " px";
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    $("theme").textContent = dark ? "Dark" : "Light";
  }
  tick();
  setInterval(tick, 1000);
  window.addEventListener("resize", tick);

  let n = 0;
  $("add").addEventListener("click", () => { $("count").textContent = ++n; });
  $("reset").addEventListener("click", () => { n = 0; $("count").textContent = n; });
</script>
</body>
</html>
